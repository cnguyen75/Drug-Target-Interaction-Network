[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dti-graph"
version = "0.1.0"
description = "Drug-Target Interaction Network Explorer"
authors = [{name = "Colin Nguyen"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash==4.4.1",
    "plotly==7.1.0",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "pyarrow==26.0.0",
    "lxml==6.1.3",
    "networkx==3.6.1",
    "scikit-learn==1.9.1",
    "node2vec==0.4.3",
    "setuptools==75.8.0",
    "gensim==4.4.0",
    "python-louvain==0.16",
    "rdkit==2024.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff format rewrites code blocks inside Markdown; prose is not its job.
exclude = [".venv", "__pycache__", ".git", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # import order: stdlib, third-party, local
    "B",                # bugbear: mutable defaults, bare except via B001/E722
    "ANN",              # type hints on every signature
    "ARG",              # unused arguments
    "PLR0913",          # too many parameters
    "PLR2004",          # magic numbers
    "C901",             # complexity
    "T20",              # print statements
    "ERA",              # commented-out code
    "FBT",              # boolean flag parameters
    "RET",              # return early / consistent returns
    "SIM",              # simplify
    "UP",               # modern syntax, X | None
    "BLE",              # blind except Exception
    "TRY",              # raise specific, no bare Exception
]
ignore = ["ANN401", "TRY003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN", "ARG"]
"test_*.py" = ["PLR2004", "ANN", "ARG"]

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

