[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dti-graph"
version = "0.1.0"
description = "Drug-Target Interaction Network Explorer"
authors = [{name = "Colin Nguyen"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash==4.4.1",
    "plotly==7.1.0",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "pyarrow==26.0.0",
    "lxml==6.1.3",
    "networkx==3.6.1",
    "scikit-learn==1.9.1",
    "node2vec==0.4.3",
    "setuptools==75.8.0",
    "gensim==4.4.0",
    "python-louvain==0.16",
    "rdkit==2024.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I"]
ignore = []
exclude = [
    ".venv",
    "__pycache__",
    ".git",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

