<circle cx="583.7" cy="116" r="6" fill="#1F6FB5"/>
<text x="786" y="121" font-size="14" fill="#231F1B"><tspan font-weight="700">0.746</tspan><tspan fill="#3D372F" font-size="12"> 0.734–0.757</tspan></text>
<text x="24" y="151" font-size="14" font-weight="600" fill="#231F1B">Random forest, uniform negatives</text>
<line x1="687.7" x2="698.5" y1="146" y2="146" stroke="#7A4E9E" stroke-width="3" stroke-linecap="round"/>
<circle cx="693.1" cy="146" r="6" fill="#7A4E9E"/>
