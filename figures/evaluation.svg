<circle cx="403.3" cy="432" r="6" fill="#8A8171"/>
<text x="786" y="437" font-size="14" fill="#231F1B"><tspan font-weight="700">0.500</tspan><tspan fill="#3D372F" font-size="12"> 0.500–0.500</tspan></text>
<text x="403.3" y="466" font-size="12" text-anchor="middle" fill="#3D372F">0.5</text>
<text x="476.7" y="466" font-size="12" text-anchor="middle" fill="#3D372F">0.6</text>
<text x="550.0" y="466" font-size="12" text-anchor="middle" fill="#3D372F">0.7</text>
