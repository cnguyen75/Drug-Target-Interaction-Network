<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 552" width="920" height="552" role="img" aria-labelledby="t d" font-family="Archivo, sans-serif">
<title id="t">ROC AUC on held-out drug-target pairs, by split and method</title>
<desc id="d">Dots are ROC AUC on held-out pairs; lines are 95% bootstrap intervals. Source: results.json, commit ab9d58a.</desc>
<rect width="920" height="552" fill="#F6F2E8"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#231F1B">How well does the model rank held-out interactions?</text>
<text x="24" y="56" font-size="14" fill="#3D372F">ROC AUC on held-out pairs (1 known interaction : 1 sampled non-interaction). Lines: 95% bootstrap interval.</text>
<text x="24" y="92" font-size="15" font-weight="700" fill="#231F1B">Random edge split</text>
<line x1="403.3" x2="403.3" y1="102" y2="252" stroke="#B3A992" stroke-width="1"/>
<line x1="476.7" x2="476.7" y1="102" y2="252" stroke="#B3A992" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="550.0" x2="550.0" y1="102" y2="252" stroke="#B3A992" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="623.3" x2="623.3" y1="102" y2="252" stroke="#B3A992" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="696.7" x2="696.7" y1="102" y2="252" stroke="#B3A992" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="770.0" x2="770.0" y1="102" y2="252" stroke="#B3A992" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="121" font-size="14" font-weight="600" fill="#231F1B">Random forest, degree-matched negatives (app)</text>
